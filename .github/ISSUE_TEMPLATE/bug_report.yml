name: Bug report
description: Report a problem with the CopperMized modpack
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please fill in the details below.
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "26.3"
    validations:
      required: true
  - type: input
    id: loader-version
    attributes:
      label: Fabric Loader version
      placeholder: "0.20.1"
    validations:
      required: true
  - type: input
    id: launcher
    attributes:
      label: Launcher
      placeholder: "Prism Launcher"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and how to reproduce it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Paste relevant logs or attach a crash report.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this one.
          required: true
