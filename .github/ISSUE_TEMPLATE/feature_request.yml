name: Feature or mod request
description: Suggest an improvement or a mod for CopperMized
title: "[Request]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What do you want to add or change?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this useful?
      description: Explain the benefit for players.
    validations:
      required: true
  - type: input
    id: mod-link
    attributes:
      label: Mod or resource link (optional)
      placeholder: "https://modrinth.com/mod/..."
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that the suggestion is not already tracked.
          required: true
        - label: The suggestion does not violate Mojang's Terms of Service.
          required: true
